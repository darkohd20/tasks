<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaksPav | Registro</title>
    <link rel="stylesheet" href="../style/style.css">
</head>

<body class="auth-body">
    <main class="auth-container">

        <aside class="auth-brand">
            <div class="brand-logo">
                <div class="brand-icon">✓</div>
                <span class="brand-name">TaksPav</span>
            </div>

            <h2 class="brand-title">Empieza hoy,<br><span>es gratis.</span></h2>
            <p class="brand-text">
                Crea tu cuenta en segundos y empieza a organizar tus tareas
                como nunca antes.
            </p>

            <ul class="brand-list">
                <li>Crea y organiza tus tareas</li>
                <li>Todo en un solo lugar</li>
                <li>Rápido, simple y seguro</li>
            </ul>
        </aside>

        <section class="auth-section">
            <p class="auth-logo-mobile">TaksPav</p>

            <h1>Crear cuenta</h1>
            <p class="auth-subtitle">Completa tus datos para registrarte</p>

            <form id="register-form" method="post">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="password_confirm">Confirmar contraseña</label>
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="••••••••" required>
                </div>

                <p class="register-message"></p>

                <button type="submit" class="save-button">Registrarse</button>
            </form>

            <p class="auth-link">
                ¿Ya tienes cuenta? <a href="../index.html">Inicia sesión aquí</a>
            </p>
        </section>

    </main>
    <script src="../JS/register.js"></script>
</body>

</html>
